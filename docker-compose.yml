services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expomind}
      POSTGRES_USER: ${POSTGRES_USER:-expomind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expomind_dev_password}
    volumes:
      - expomind_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expomind} -d ${POSTGRES_DB:-expomind}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-expomind}:${POSTGRES_PASSWORD:-expomind_dev_password}@database:5432/${POSTGRES_DB:-expomind}
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-production}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@expomind.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeThisAdminPassword2026!}
      ADMIN_NAME: ${ADMIN_NAME:-ExpoMind Admin}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen-vl-max}
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      HF_HOME: /data/models
      OLLAMA_BASE_URL: http://ollama:11434
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:0.5b}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      HTTP_PROXY: ${OUTBOUND_PROXY:-}
      HTTPS_PROXY: ${OUTBOUND_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,database,backend,frontend,ollama
    depends_on:
      database:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${LOCAL_UPLOADS_PATH:-./data/uploads}
        target: /data/uploads
      - expomind_models:/data/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      HTTP_PROXY: ${OUTBOUND_PROXY:-}
      HTTPS_PROXY: ${OUTBOUND_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,0.0.0.0,ollama
    volumes:
      - expomind_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${LOCAL_LLM_MODEL:-qwen2.5:0.5b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${APP_PORT:-8088}:80"
      - "${APP_ALT_PORT:-8089}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  https:
    image: caddy:2.10-alpine
    profiles: ["production"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  expomind_db:
  expomind_media:
  expomind_models:
  expomind_ollama:
  caddy_data:
  caddy_config:
